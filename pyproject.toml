[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trendbio-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pydantic>=2,<3",
  "httpx",
  "feedparser",
  "scikit-learn",
  "umap-learn==0.5.11",
  "numpy",
  "sentence-transformers",
  "anthropic",
  "typer",
  "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "respx"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
