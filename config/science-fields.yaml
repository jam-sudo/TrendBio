Formal and computing sciences:
  math:
    scope: Mathematical structures, proofs, numerical methods, probability and statistical inference.
  computer-information:
    scope: Algorithms, AI and machine learning, software, systems, data, networks, robotics, human–computer interaction and information science.
Physical sciences:
  physics:
    scope: Matter, energy and the laws of nature. The daily edition covers quantum physics, optics, mesoscopic physics and cosmology.
  astronomy:
    scope: Observations and models of stars and galaxies within Physics.
    parent: physics
  physics-expanded:
    scope: A wider Physics pilot covering atomic, statistical, gravitational, particle, nuclear, fluid and plasma physics alongside the daily subjects and astronomy.
    parent: physics
  chemistry:
    scope: The composition, structure, properties and transformations of substances.
Earth and environmental sciences:
  earth-environment:
    scope: The solid Earth, oceans, atmosphere, climate, water, ecosystems and conservation.
Biological sciences:
  biology:
    scope: Mechanisms and observations across cells, organisms, populations and ecosystems.
  computational:
    scope: Methods, data and research software for answering biological questions.
    parent: biology
Engineering and technology:
  engineering:
    scope: The design and measured performance of devices, materials, structures, processes and engineered systems.
Medical and health sciences:
  medicine-health:
    scope: Biological mechanisms of disease, clinical outcomes, rehabilitation, epidemiology and population health.
Agricultural, food and veterinary sciences:
  agriculture-food-veterinary:
    scope: Crop and animal production, soils, forestry, fisheries, food quality and animal health.
