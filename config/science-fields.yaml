Formal and computing sciences:
  math: Mathematical structures, proofs, numerical methods, probability and statistical inference.
  computer-information: Algorithms, AI and machine learning, software, systems, data, networks, robotics, human–computer interaction and information science.
Physical sciences:
  physics: Matter, energy and the laws of nature. The daily edition covers quantum physics, optics, mesoscopic physics and cosmology.
  astronomy: Observations and models of stars and galaxies within Physics.
  physics-expanded: A wider Physics pilot covering atomic, statistical, gravitational, particle, nuclear, fluid and plasma physics alongside the daily subjects and astronomy.
  chemistry: The composition, structure, properties and transformations of substances.
Earth and environmental sciences:
  earth-environment: The solid Earth, oceans, atmosphere, climate, water, ecosystems and conservation.
Biological sciences:
  biology: Mechanisms and observations across cells, organisms, populations and ecosystems.
  computational: Methods, data and research software for answering biological questions.
Engineering and technology:
  engineering: The design and measured performance of devices, materials, structures, processes and engineered systems.
Medical and health sciences:
  medicine-health: Biological mechanisms of disease, clinical outcomes, rehabilitation, epidemiology and population health.
Agricultural, food and veterinary sciences:
  agriculture-food-veterinary: Crop and animal production, soils, forestry, fisheries, food quality and animal health.
