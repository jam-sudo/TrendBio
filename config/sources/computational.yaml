biorxiv:
  endpoint: https://api.biorxiv.org/details/biorxiv
  categories: [bioinformatics, genomics, systems biology, synthetic biology, biophysics, molecular biology, cell biology]
  keyword_filtered_categories: [molecular biology, cell biology]
arxiv:
  endpoint: https://export.arxiv.org/api/query
  categories: [q-bio.*]
  keyword_filtered: [cs.LG, cs.AI, stat.ML]
keywords:
  - bioinformatics
  - computational biology
  - genomics
  - genome
  - genomic
  - transcriptomics
  - transcriptome
  - proteomics
  - proteome
  - metabolomics
  - metabolome
  - epigenomics
  - epigenome
  - single-cell
  - single cell
  - scrna
  - scatac
  - rna-seq
  - rna sequencing
  - atac-seq
  - spatial transcriptomics
  - spatial analysis
  - gene expression
  - gene regulation
  - gene regulatory
  - gene editing
  - crispr
  - protein design
  - protein folding
  - protein structure
  - protein language model
  - structure prediction
  - molecular dynamics
  - molecular docking
  - drug discovery
  - drug design
  - therapeutics
  - pharmacokinetic
  - cheminformatics
  - chemoinformatics
  - systems biology
  - synthetic biology
  - multi-omics
  - multiomics
  - variant calling
  - pangenome
  - gwas
  - sequence alignment
  - genome assembly
  - metagenomics
  - microbiome
  - phylogenetic
  - cell atlas
  - cell type
  - perturbation model
  - alphafold
  - bionemo
  - biological foundation model
pubmed:
  endpoint: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
  journals:
    - Bioinformatics
    - Genome Biology
    - Nature Methods
    - Nature Biotechnology
    - Nucleic Acids Research
    - Cell Systems
    - PLOS Computational Biology
    - Genome Research
    - Briefings in Bioinformatics
    - BMC Bioinformatics
    - Nature Computational Science
    - Nature Machine Intelligence
    - Cell Genomics
    - Molecular Systems Biology
    - GigaScience
    - eLife
  query: '("Computational Biology"[MeSH Terms] OR "bioinformatics"[Title/Abstract] OR "single-cell"[Title/Abstract] OR "protein design"[Title/Abstract] OR ("Machine Learning"[MeSH Terms] AND (genomics[Title/Abstract] OR protein[Title/Abstract] OR "drug discovery"[Title/Abstract])))'
github:
  endpoint: https://api.github.com
  watchlist:
    - scverse/scanpy
    - scverse/anndata
    - scverse/scvi-tools
    - satijalab/seurat
    - stuart-lab/signac
    - google-deepmind/alphafold
    - google-deepmind/alphafold3
    - facebookresearch/esm
    - RosettaCommons/RFdiffusion
    - dauparas/ProteinMPNN
    - sokrypton/ColabFold
    - deepchem/deepchem
    - rdkit/rdkit
    - biopython/biopython
    - snakemake/snakemake
    - nextflow-io/nextflow
    - nf-core/rnaseq
    - broadinstitute/gatk
    - lh3/minimap2
    - samtools/samtools
  topics: [bioinformatics, computational-biology, genomics, single-cell, protein-design, proteomics, transcriptomics, drug-discovery]
  top_n_per_topic: 50
rss:
  # Verified public RSS feeds from the spec examples; some other examples have no public feed.
  feeds:
    - {name: insitro, url: 'https://www.insitro.com/feed/', kind: company}
    - {name: CZI, url: 'https://chanzuckerberg.com/feed/', kind: company}
    - {name: NVIDIA BioNeMo, url: 'https://blogs.nvidia.com/feed/', kind: company}
    - {name: Google DeepMind science, url: 'https://deepmind.google/blog/rss.xml', kind: company}
    - {name: Microsoft Research health, url: 'https://www.microsoft.com/en-us/research/feed/', kind: company}
    - {name: GEN, url: 'https://www.genengnews.com/feed/', kind: news}
    - {name: STAT, url: 'https://www.statnews.com/feed/', kind: news}
