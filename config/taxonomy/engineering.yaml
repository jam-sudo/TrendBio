domain: engineering
label: Engineering systems, materials and buildings
window_by_publication: true
review_cluster_cohesion: true
compare_reported_results: true
fallback_category: other-engineering
relevance: >
  Include engineering research on the design or evaluation of materials, manufactured parts,
  mechanical or electrical systems, control methods, buildings and infrastructure. Assign the
  main engineering question. Require a design, technical performance or validation result for research on buildings, cities and infrastructure. Exclude editorials, corrections and papers whose only connection
  is using an established tool to answer a question in another field.
comparison_guidance: >
  For each paper identify the system under test, the engineering quantity or design task,
  and the result the authors obtained. Quote a continuous passage supporting that result.
  Identify the baseline, operating conditions and evidence available, including analysis,
  simulation, bench tests and field measurements. Name a question the reported results
  answer together. Keep independent approaches to the same outcome together even when the
  workloads, sites, comparators or units differ. Group distinct outcomes separately.
  For optimization and control, check what is optimized, which performance was evaluated
  and under what assumptions a guarantee holds. A common application or algorithm gives
  context. Look for evidence of the same design task or performance measure in each member.
  Distinguish measured secondary outcomes from motivation and future work.
synthesis_guidance: >
  Specify the component or system, the operating conditions and the comparator for each result.
  Distinguish simulation, bench experiment, field measurement and deployment in the headline
  and summary. Keep units, test loads, scale and error or efficiency measures with the study
  that reports them. Name the verified common outcome in the headline or short summary.
  Attribute a numerical gain, proof or field result to the paper and baseline that support it.
  Use the level of validation each paper reports. Describe results from the same team or
  reused test data as related evidence.
categories:
  - {slug: manufacturing-materials, label: Manufacturing and materials, covers: "manufacturing processes, material properties and component qualification"}
  - {slug: electrical-control, label: Electrical and control systems, covers: "electronics, control design, industrial system identification and evaluation"}
  - {slug: mechanical, label: Mechanical and wind engineering, covers: "machines, mechanical structures, energy conversion and wind turbine engineering"}
  - {slug: built-environment, label: Buildings and infrastructure, covers: "building performance, construction, structural and civil infrastructure engineering"}
  - {slug: other-engineering, label: Other engineering, covers: "engineering research spanning the sampled design and evaluation areas"}
