domain: astronomy
label: Stellar and Galactic Astronomy
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-astronomy
relevance: >
  Include studies of stars, stellar populations, the interstellar medium, and the formation
  or evolution of galaxies. Include instruments or analysis methods evaluated for a specific
  stellar or galactic measurement. Classify by the principal research question.
synthesis_guidance: >
  Identify what was directly observed, inferred from measurements, or predicted in a
  simulation. Distinguish detections, upper limits, forecasts, and proposed observations.
  Keep the object or population, instrument, sample size, and uncertainty with the paper
  that reports them. In the headline and short summary, retain any assumption that changes
  a detection to an upper limit. Attribute target selection, spectral fitting and inferred
  parameters to their respective studies. A shared telescope, catalog or target class
  alone does not establish a common research question.
categories:
  - {slug: stellar, label: Stellar astronomy, covers: "stellar populations, stars, stellar remnants, and the Sun"}
  - {slug: galactic, label: Galactic astronomy, covers: "galaxies, their gas and dust, structure, and evolution"}
  - {slug: other-astronomy, label: Other stellar and galactic research, covers: "instrumentation and work spanning stellar and galactic scales"}
