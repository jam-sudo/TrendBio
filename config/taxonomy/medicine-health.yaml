domain: medicine-health
label: Clinical, rehabilitation and population health research
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-health
relevance: >
  Include completed clinical and rehabilitation studies, population and health services
  research and evidence syntheses. Determine the design from the methods and results.
  Exclude protocols, editorials, correction notices and papers without completed health research.
synthesis_guidance: >
  Identify each study's population, setting, design, comparator, outcome and uncertainty using
  the supplied abstract. Distinguish randomization from observational association, cross-sectional
  from longitudinal data, and feasibility or surrogate endpoints from patient outcomes.
  Separate reviews from their underlying studies. Attribute numbers and confidence intervals
  to their source and avoid counting overlapping cohorts as independent confirmation.
  State when a correction is linked to a supporting study and avoid generalizing from the
  affected estimate. Describe research findings without giving treatment advice.
categories:
  - {slug: clinical-research, label: Clinical studies, covers: "patient outcomes, clinical trials, cohort studies and diagnostic research"}
  - {slug: rehabilitation-ageing, label: Rehabilitation and ageing, covers: "functional outcomes, rehabilitation and health in older adults"}
  - {slug: health-services, label: Health services and care delivery, covers: "access, quality, health workforce, service delivery and implementation"}
  - {slug: population-health, label: Population and public health, covers: "population studies, epidemiology, prevention, inequalities and environmental determinants"}
  - {slug: evidence-synthesis, label: Health evidence synthesis, covers: "systematic reviews, scoping reviews and meta-analyses of health research"}
  - {slug: other-health, label: Other health research, covers: "completed health research spanning the sampled areas"}
