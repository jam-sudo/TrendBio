domain: computational
categories:
  - slug: genomics
    label: Genomics
    covers: genome assembly, variant calling, pangenomes, population genetics, GWAS methods
  - slug: transcriptomics
    label: Transcriptomics
    covers: bulk RNA-seq methods, isoform analysis, spatial transcriptomics
  - slug: proteomics
    label: Proteomics
    covers: mass-spec informatics, PTM analysis, protein quantification
  - slug: metabolomics
    label: Metabolomics
    covers: metabolite ID, flux analysis, lipidomics
  - slug: epigenomics
    label: Epigenomics
    covers: methylation, chromatin accessibility, 3D genome, histone marks
  - slug: single-cell
    label: Single-cell
    covers: scRNA/scATAC methods, integration, trajectory, perturbation models, cell atlases
  - slug: structural
    label: Structural bio & protein design
    covers: structure prediction, protein design, docking, molecular dynamics
  - slug: systems
    label: Systems biology
    covers: networks, modelling, gene regulation, multi-omics integration
  - slug: ml-ai
    label: ML / AI methods
    covers: foundation models, representation learning, benchmarks, where the contribution is the method rather than the biology
  - slug: tools-infra
    label: Tools & infrastructure
    covers: workflow managers, file formats, databases, cloud/HPC, visualization
  - slug: industry
    label: Industry
    covers: company announcements, funding, product launches, partnerships
