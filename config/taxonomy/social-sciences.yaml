domain: social-sciences
label: Economics, business, psychology and cognition
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-social-sciences
relevance: >
  Include empirical, theoretical and methodological research on economies, businesses,
  development, psychology and cognition. Distinguish replications and registered reports
  with results from protocols. Exclude announcements and papers whose central research
  question falls outside the sampled social sciences.
synthesis_guidance: >
  Name the population, setting, study design and outcome. Distinguish experiments, natural
  experiments, observational studies, surveys, theoretical models and replications. State which
  finding is causal and the identification assumptions it requires. Attribute model predictions
  and associations to their design. Keep working papers distinct from journal publications.
  Check for common data, translations and versions before describing independent evidence.
categories:
  - {slug: economics-business, label: Economics and business, covers: "markets, firms, labor and business decisions"}
  - {slug: econometrics, label: Econometrics, covers: "economic identification, estimation, measurement and statistical inference"}
  - {slug: development-policy, label: Development economics and public policy, covers: "development, public policy and regional economic evidence"}
  - {slug: psychology-cognition, label: Psychology and cognition, covers: "cognition, learning, attention, perception and individual differences"}
  - {slug: social-psychology, label: Social psychology, covers: "social behavior, groups and interpersonal judgments"}
  - {slug: research-methods, label: Social research methods and replication, covers: "study design, datasets, measurement, registered reports and replication"}
  - {slug: other-social-sciences, label: Other social research, covers: "work spanning the sampled social science areas"}
