domain: social-sciences
label: Social sciences
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-social-sciences
relevance: >
  Include original empirical, qualitative, theoretical, legal and methodological research
  in the sampled social sciences. Classify by the main question. Teaching and learning
  in schools and universities belong in education. General cognitive processes belong in
  psychology. Include replications and registered reports with results. Set relevant to
  false for protocols, editorials, book reviews and literature overviews without an original analysis.
cohesion_guidance: >
  State a question that every grouped study can answer about a defined social phenomenon,
  institution, legal issue, relationship or outcome. Identify the observed outcome, argument
  or predicted quantity in each paper. Compare across populations, settings, jurisdictions
  and methods when they inform that shared question. Separate studies linked solely by a
  platform, country, population, research method or broad topic such as education.
synthesis_guidance: >
  Name the population, setting, study design and outcome. Distinguish experiments, natural
  experiments, observational studies, surveys, theoretical models and replications. State which
  finding is causal and the identification assumptions it requires. Attribute model predictions
  and associations to their design. Keep working papers distinct from journal publications.
  Check for common data, translations and versions before describing independent evidence.
  Give the jurisdiction for legal arguments and separate reported perceptions from behavior
  or demonstrated learning. Attribute each outcome to the study and sample that supplied it.
