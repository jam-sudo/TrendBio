domain: earth-environment
label: Earth and environmental observations
window_by_publication: true
fallback_category: other-earth
relevance: >
  Include research on the solid Earth, the atmosphere, oceans, past climate and observed Earth systems.
  Distinguish a data description from a study using the data and classify by the research question.
  Exclude editorials, corrigenda, retractions and journal announcements.
synthesis_guidance: >
  Preserve geographic extent, observation dates, uncertainty, baseline and units when the authors supply them.
  Distinguish measurements, model projections and reconstructions. Identify a shared dataset across papers.
  Attribute local findings to their study regions and periods.
categories:
  - {slug: geology, label: Solid Earth, covers: "geology, geophysics and the Earth's interior"}
  - {slug: atmosphere, label: Atmosphere, covers: "atmospheric composition, dynamics and observations"}
  - {slug: oceans, label: Oceans, covers: "ocean circulation and marine observations"}
  - {slug: climate, label: Climate, covers: "climate reconstruction, change and variability"}
  - {slug: observational-data, label: Observational data, covers: "data papers that describe and validate Earth system records"}
  - {slug: other-earth, label: Other Earth research, covers: "cross-disciplinary work within the pilot's coverage"}
