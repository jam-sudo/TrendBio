domain: earth-environment
label: Earth and environmental observations
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-earth
relevance: >
  Include original observations, reconstructions and models of the solid Earth, atmosphere, oceans,
  climate, water resources, ecosystems and biodiversity conservation. Include natural forest soil
  and biodiversity studies that evaluate ecosystem relationships. Classify by the main outcome.
  Water availability and quality, habitat change and conservation outcomes belong here. A clinical
  outcome or an engineering performance metric alone belongs in its respective field.
  Distinguish a data description from a study using the data and classify by the research question.
  Exclude editorials, corrigenda, retractions and journal announcements.
synthesis_guidance: >
  Preserve geographic extent, observation dates, uncertainty, baseline and units when the authors supply them.
  Distinguish measurements, model projections and reconstructions. Name a shared input dataset when
  the sources identify it. Missing cross-references leave overlap unknown.
  Attribute local findings to their study regions and periods.
  Attribute modeled habitat suitability, observed species occurrence and measured conservation effects
  to their respective studies. Preserve the difference between a projected and an observed change.
categories:
  - {slug: geology, label: Solid Earth, covers: "geology, geophysics and the Earth's interior"}
  - {slug: atmosphere, label: Atmosphere, covers: "atmospheric composition, dynamics and observations"}
  - {slug: oceans, label: Oceans, covers: "ocean circulation and marine observations"}
  - {slug: climate, label: Climate, covers: "climate reconstruction, change and variability"}
  - {slug: freshwater, label: Water resources and quality, covers: "hydrology, water quality, water availability and access"}
  - {slug: conservation, label: Ecosystems and conservation, covers: "habitat and biodiversity change, ecosystem services, restoration and conservation outcomes"}
  - {slug: observational-data, label: Observational data, covers: "data papers that describe and validate Earth system records"}
  - {slug: other-earth, label: Other Earth research, covers: "cross-disciplinary work within the pilot's coverage"}
