domain: physics-expanded
label: Physics across sixteen arXiv archives
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-physics
relevance: >
  Include original theoretical, experimental, observational or computational contributions
  to physics, and instruments or methods evaluated for a specific physics measurement.
  Classify by the main physical question. A cross-listing or analogy alone is insufficient.
cohesion_guidance: >
  For each paper first identify the physical system, the quantity or task studied and
  the result the authors measured, calculated or sought to constrain. Name each group
  as a single question these results can answer together. Cite a passage from each
  paper that identifies its contribution to that question. If two papers share an
  instrument, survey, algorithm, or mathematical invariant, compare their actual
  outcomes before adding the next paper. Give papers with different outcomes their
  own groups. Keep competing methods together when they estimate the same physical
  quantity or solve the same defined task. Observations and predictions of the same
  observable can also be compared. A proposed observation counts as a proposal.
comparison_guidance: >
  Independently test the proposed comparison against the original physics papers. Read the
  proposed topic, titles and abstracts as evidence to examine. Identify the output each
  paper actually measures, estimates, predicts, constrains or proves. Find the most inclusive
  question with a definite shared observable, theoretical relationship or performance target.
  Keep papers together when their results can inform that question under different materials,
  settings, instruments, boundary conditions or protocols. The magnitude, uncertainty, range
  of validity and recoverability of the same quantity can be compared. A precise per-paper
  result belongs in its evidence passage. Do not put every study-specific condition into the
  common question. An input, motivating example or downstream application alone is insufficient.
  If the proposed topic is broad, try a meaningful subset before separating the papers. Reject
  a grouping that has only a technique, platform or discipline in common. State one question
  per group in the topic field. List every numbered paper exactly once, including pairs and
  singletons. For each paper copy a continuous passage from its own title or abstract naming
  its contribution.
synthesis_guidance: >
  Identify the shared physical quantity, system and question. Attribute observations, calculations
  and forecasts to the papers that report them. Specify when an upper bound or detection depends
  on an assumed model or prior, including in the headline and short summary. Distinguish spectra
  used to select targets from observations used to fit them. Keep simulations, proposed tests
  and theoretical deductions distinct from experimental measurements. Keep intervals,
  uncertainties and the conditions under which a result holds attached to the reported quantity.
  Identify papers from the same observing program, attach observables to their respective
  studies, and retain candidate identifications and the status of proposed physical causes.
  For computational work, distinguish the physical system simulated from the CPU, GPU
  or device on which timing was measured. Attribute simulated and measured timings separately.
  Give the population and selection range with a reported prevalence in the headline or
  short summary. Tie new theoretical classifications to the specific model that yielded
  them. When a short headline cannot accommodate those qualifications, narrow the claim.
categories:
  - {slug: quantum, label: Quantum physics, covers: "quantum information, quantum measurement, many-body quantum systems"}
  - {slug: optics, label: Optics and photonics, covers: "light propagation, optical materials, imaging, lasers and photonic devices"}
  - {slug: condensed-matter, label: Mesoscale and nanoscale physics, covers: "electronic transport, low-dimensional materials, mesoscopic devices"}
  - {slug: cosmology, label: Cosmology, covers: "the early universe, cosmic expansion, dark matter and large-scale structure"}
  - {slug: stellar, label: Stellar astronomy, covers: "stars, stellar populations, the Sun and stellar remnants"}
  - {slug: galactic, label: Galactic astronomy, covers: "galaxy structure and evolution, gas, dust and the interstellar medium"}
  - {slug: gravitation, label: Gravitation and relativity, covers: "classical and quantum gravity, relativity, compact-object space-times and gravitational waves"}
  - {slug: particle, label: Particle physics, covers: "elementary particles, field and string theory, lattice gauge theories, collider measurements and phenomenology"}
  - {slug: nuclear, label: Nuclear physics, covers: "nuclear structure and reactions, hadronic interactions, heavy-ion collisions and nuclear matter"}
  - {slug: fluids, label: Fluid dynamics, covers: "fluid interfaces, hydrodynamic instabilities, transport and turbulence"}
  - {slug: plasmas, label: Plasma physics, covers: "collective processes in ionized matter, confinement and plasma waves"}
  - {slug: statistical, label: Statistical physics, covers: "equilibrium and nonequilibrium ensembles, critical phenomena, fluctuations and statistical mechanics"}
  - {slug: other-physics, label: Other physics, covers: "interdisciplinary physics contributions outside the named categories"}
