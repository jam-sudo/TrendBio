domain: physics-expanded
label: Expanded physics
window_by_publication: true
review_cluster_cohesion: true
compare_reported_results: true
fallback_category: other-physics
relevance: >
  Include original theoretical, experimental, observational or computational contributions
  to physics, and instruments or methods evaluated for a specific physics measurement.
  Classify by the main physical question. A cross-listing or analogy alone is insufficient.
cohesion_guidance: >
  For each paper first identify the physical system, the quantity or task studied and
  the result the authors measured, calculated or sought to constrain. Name each group
  as a single question these results can answer together. Cite a passage from each
  paper that identifies its contribution to that question. If two papers share an
  instrument, survey, algorithm, or mathematical invariant, compare their actual
  outcomes before adding the next paper. Give papers with different outcomes their
  own groups. Keep competing methods together when they estimate the same physical
  quantity or solve the same defined task. Observations and predictions of the same
  observable can also be compared. A proposed observation counts as a proposal.
comparison_guidance: >
  First name the concrete observable, physical relationship or tested detection task in the
  proposed topic. Set aside any mechanism or interpretation that only some authors investigate.
  Check the first review's proposed passages against the full title and abstract of every paper.
  For each paper describe the result it reports about that observable and quote the passage that
  establishes it. Look for a measured secondary result when the main result concerns calibration,
  a catalogue or a model. If the observable is missing, say what the paper reports instead.
  Compare the targets and quantities before partitioning the paper numbers. Retain the largest
  subset that answers the same concrete question, including measurements from different samples,
  instruments or environments. For detection studies identify exactly what the method is tested
  to recover and distinguish the validation metrics and denominators. For each remaining group
  state its own question. A shared apparatus, signal name or analytical method alone gives no
  physical comparison. Every paper needs one result, one continuous source passage and one group.
arxiv_recap_guidance: >
  For papers with an arXiv submission comment, check whether the authors attribute the
  result in question to earlier work. Count the new measurement, calculation, or analysis
  the paper contributes. Place an account that only recaps prior results in its own group.
  A conference paper or a companion analysis can contribute original work. The submission
  comment gives publication context. Quote the title or abstract for the scientific result.
synthesis_guidance: >
  Identify the shared physical quantity, system and question. Attribute observations, calculations
  and forecasts to the papers that report them. Specify when an upper bound or detection depends
  on an assumed model or prior, including in the headline and short summary. Distinguish spectra
  used to select targets from observations used to fit them. Keep simulations, proposed tests
  and theoretical deductions distinct from experimental measurements. Identify which quantity was
  measured directly and which was inferred from measured inputs, including in the headline.
  Keep intervals, uncertainties and the conditions under which a result holds attached to the reported quantity.
  Identify papers from the same observing program, attach observables to their respective
  studies, and retain candidate identifications and the status of proposed physical causes.
  Mention shared authorship when it helps explain a scientific dependency. Make claims about
  shared data or exclusive contributions only when the source supports them.
  For computational work, distinguish the physical system simulated from the CPU, GPU
  or device on which timing was measured. Attribute simulated and measured timings separately.
  Give the population and selection range with a reported prevalence in the headline or
  short summary. A conclusion applying to all papers needs support in each paper. When the
  evidence differs, name the model or study that supplies the result. Assign each intervention
  its observed effect separately. An abstract cut off before its findings can support the
  research question. Qualify any claim about its result. Tie new theoretical classifications
  to the specific model that yielded them. When a short headline cannot accommodate those qualifications, narrow the claim.
