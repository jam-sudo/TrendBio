domain: computer-information
label: Computer Science
window_by_publication: true
review_cluster_cohesion: true
share_editorial_decisions: true
fallback_category: other-computing
relevance: >
  Include original computer science research. Classify each work by its main technical
  contribution and the outcome evaluated. A general learning algorithm belongs in machine
  learning. A retrieval technique tested with a language model belongs in retrieval when
  retrieval is the contribution. For interdisciplinary studies require a computing contribution
  beyond applying an existing tool. Graphics and HCI qualify when a paper introduces and
  demonstrates a computing or interaction technique, or evaluates an interface with users.
  An artistic portfolio or a design vision without such evidence is outside this field.
  Information science includes methods and resources for organizing, retrieving or validating
  information. Classify a schema or dataset documenting the provenance and dependencies of
  computing artifacts under information or data. Use AI and machine learning when the
  contribution concerns learning, inference or model behavior. A study measuring authorship, citation habits or attitudes toward AI alone is
  outside this field. Exclude work solely about social behavior, policy, business or cultural
  interpretation. In security, include defensive evaluation, privacy and cryptography.
  Exclude operational intrusion techniques. Describe a technical contribution in words when
  a quantitative claim cannot be supported directly from its abstract.
synthesis_guidance: >
  Compare the task, performance measure, workload and assumptions. Attribute bounds,
  user-study findings and benchmark results to the individual papers. Distinguish proofs
  from experiments. For privacy and security describe defensive findings at a high level.
