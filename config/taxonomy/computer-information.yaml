domain: computer-information
label: Computing and Information Science
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-computing
relevance: >
  Include original work on algorithms, distributed and operating systems, human-computer
  interaction, digital libraries and information science. Choose the main contribution.
  A paper using a standard computational tool to answer only a different field's
  question belongs in that field.
synthesis_guidance: >
  Keep a complexity bound and its assumptions, a system measurement and its workload,
  or a user-study finding and its participants with the specific paper that reports it.
  Separate empirical comparisons from proofs. Require a shared research question across
  independent works. A shared conference, benchmark name or research method alone is
  insufficient. Describe research findings at the level of the published contribution.
categories:
  - {slug: algorithms, label: Algorithms and theory, covers: "data structures, algorithms, complexity and their formal guarantees"}
  - {slug: systems, label: Computer systems, covers: "distributed, parallel and operating systems, including their evaluation"}
  - {slug: hci, label: Human-computer interaction, covers: "interaction design, accessibility, user studies and human-computer collaboration"}
  - {slug: information, label: Library and information science, covers: "digital libraries, scholarly communication, information seeking and curation"}
  - {slug: other-computing, label: Other computing research, covers: "contributions spanning the sampled areas without a dominant category"}
