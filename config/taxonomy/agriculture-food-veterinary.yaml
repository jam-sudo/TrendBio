domain: agriculture-food-veterinary
label: Agriculture, food and veterinary research
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-agriculture
relevance: >
  Include original studies of crops and soils, farm management, forests, fisheries,
  aquaculture, animal health or welfare, food processing and quality. Choose the main
  research question across these journals. Exclude editorials, corrections and work
  without an agricultural, forestry, fisheries, food or veterinary research question.
synthesis_guidance: >
  Specify the crop, stock, animal population, food product or farm system, location and
  study conditions for each result. Distinguish field trials, farm surveys, controlled
  experiments and simulations, including in the headline. Keep yields, quality measures,
  welfare outcomes and uncertainty attached to their comparator, units and study setting.
  An association in farm records or a simulated yield requires its own qualification.
categories:
  - {slug: crops-soils, label: Crops and soils, covers: "crop production, agronomy, water and soil management"}
  - {slug: farm-systems, label: Farm systems and rural production, covers: "farm management, regional production systems and agricultural economics"}
  - {slug: forestry, label: Forestry, covers: "forest management, inventories, harvest and silviculture"}
  - {slug: fisheries, label: Fisheries and aquaculture, covers: "fish stocks, aquatic production, aquaculture and fisheries management"}
  - {slug: animal-health, label: Animal health and welfare, covers: "veterinary research, animal welfare and livestock health"}
  - {slug: food-processing, label: Food processing and quality, covers: "food handling, storage, preservation, sensory quality and processing measurements"}
  - {slug: other-agriculture, label: Other agricultural research, covers: "agricultural research spanning the sampled areas"}
