domain: biology
label: Biology
fallback_category: other-biology
relevance: >
  Include original experimental, observational, theoretical and computational research that
  addresses a biological question, from molecules and cells to populations and ecosystems.
  Include replication studies, natural history and new biological datasets. Classify by the
  main biological question. Exclude editorials, clinical treatment recommendations and
  generic computation without a biological application.
categories:
  - {slug: molecular-cell, label: Molecular and cell biology, covers: "cell structure, molecular function, metabolism and cell signalling"}
  - {slug: genetics, label: Genetics and genomics, covers: "inheritance, gene regulation and genome organization"}
  - {slug: development, label: Developmental biology, covers: "embryology, differentiation, morphogenesis and life cycles"}
  - {slug: organisms, label: Organismal biology, covers: "animal behavior, physiology, anatomy and zoology"}
  - {slug: plants, label: Plant biology, covers: "plant growth, physiology and interactions with the environment"}
  - {slug: ecology, label: Ecology, covers: "populations, communities, ecosystems and conservation"}
  - {slug: evolution, label: Evolution and paleobiology, covers: "adaptation, biodiversity, phylogeny and the fossil record"}
  - {slug: neuroscience, label: Neuroscience, covers: "nervous systems, neural circuits, sensory biology and cognition"}
  - {slug: quantitative, label: Quantitative biology, covers: "biophysics, systems biology and computational methods for biology"}
  - {slug: microbial-ecology, label: Microbial ecology, covers: "microbial communities, symbiosis, environmental microbiomes and nutrient cycling"}
  - {slug: immunity, label: Immunobiology, covers: "immune homeostasis, tolerance, autoimmunity and immune cell biology"}
  - {slug: other-biology, label: Other biology, covers: "biological research outside the named areas"}
