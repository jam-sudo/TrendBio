domain: humanities-arts
label: Humanities and arts research
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-humanities
relevance: >
  Include original humanities and arts scholarship, critical editions, edited research volumes,
  historical or linguistic analysis, arguments in philosophy, and research on material, visual,
  musical or performance practices. Identify the object, question, context and approach.
  Exclude creative works alone, textbooks, book reviews, announcements, bibliographies and
  catalogue promotion without an identifiable scholarly argument. One volume or translated
  edition can supply one work. The author's abstract or catalogue description is the evidence.
synthesis_guidance: >
  Attribute arguments and interpretations to the authors. Name the corpus, object, place or
  period when stated and explain which sources support the shared question. Distinguish a
  monograph, an edited volume, a critical edition and a journal article. A set of chapters
  or language versions of one book counts once. A catalogue description describes the scope
  of a book and cannot establish a result it does not report. Distinguish interpretations from
  measurements and do not infer causal effects, agreement or scholarly consensus from proximity.
categories:
  - {slug: history-archaeology, label: History and archaeology, covers: "history, archaeology, material heritage and historical sources"}
  - {slug: languages-literature, label: Languages and literature, covers: "linguistics, philology, comparative literature, translation and critical editions"}
  - {slug: philosophy-religion, label: Philosophy and religious studies, covers: "philosophy, ethics, logic, theology as research and the study of religion"}
  - {slug: arts-performance, label: Visual and performing arts, covers: "art history, musicology, theatre, dance, cinema, architecture and design history"}
  - {slug: digital-humanities, label: Digital humanities, covers: "digital corpora, scholarly editing and computational analysis of humanities sources"}
  - {slug: other-humanities, label: Other humanities research, covers: "interdisciplinary work across the sampled humanities and arts"}
