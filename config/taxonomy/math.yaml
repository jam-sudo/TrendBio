domain: math
label: Mathematics and Statistics
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-math
relevance: >
  Include original number theory, numerical analysis and statistical methodology.
  Classify by the main contribution, including rigorous theory and experimental
  evaluation of a numerical or statistical method. Exclude a routine application
  without a contribution in these fields. Preserve assumptions and distinguish a
  proved theorem, a conjecture, an error bound and an empirical observation.
comparison_guidance: >
  Independently check the proposed question against each mathematical paper. Identify
  the object and what the authors establish, compute, estimate or test about it.
  Find a specific shared problem that a reader can compare across the papers. Different
  equations in a defined family, algorithms for the same task, or empirical and theoretical
  answers to the same convergence question can belong together. For statistical inference
  identify the estimand, selection target or guarantee being studied. For numerical work
  distinguish the quantity being approximated from the algorithm used to approximate it.
  Check whether a shared term such as stability or convergence refers to the same property.
  A method used as a tool in a paper is evidence for a group only if that paper investigates
  the proposed question. If the whole group is too broad, look for a comparable subset.
  State one precise question for each group. Account for every numbered paper once,
  including pairs and singletons. Copy one exact continuous passage from each paper's
  title or abstract supporting its assignment.
synthesis_guidance: >
  Preserve the hypotheses needed for each theorem, its conclusion, the conditions
  on numerical convergence or error, and the sampling assumptions for statistical
  guarantees. Attribute different guarantees to the papers that establish them.
  Identify a conjecture or simulation as such. Omit a claim whose conditions
  cannot be established from the supplied abstracts.
  If a sentence assigns a publication month to multiple papers, check every listed date.
  Report numerical convergence observed in experiments separately from a proved bound.
  Apply these distinctions to the headline and short summary as well as the detailed
  account. Tie a rate or guarantee to the mathematical object, hypotheses and paper
  that establish it. When papers answer a shared question differently, use the question
  to frame the headline. Distinguish an existing method being analysed or implemented
  from a new construction. Retain any counterexample or null result that limits the claim.
categories:
  - {slug: number-theory, label: Number theory, covers: "arithmetic, prime numbers, Diophantine equations and arithmetic geometry"}
  - {slug: numerical-analysis, label: Numerical analysis, covers: "numerical methods, approximation, stability, convergence and error analysis"}
  - {slug: statistical-methodology, label: Statistical methodology, covers: "estimation, inference, identification, experimental design and uncertainty"}
  - {slug: other-math, label: Cross-disciplinary methods, covers: "relevant contributions spanning the pilot areas without a dominant category"}
