domain: physics
label: Physics
fallback_category: other-physics
relevance: >
  Set relevant to true for a theoretical, experimental, observational or computational
  contribution to physics, including instruments and methods that enable a physics measurement.
  Set it to false for papers whose only connection to physics is a metaphor or a cross-listing.
categories:
  - slug: quantum
    label: Quantum physics
    covers: quantum information, quantum measurement, many-body quantum systems
  - slug: optics
    label: Optics and photonics
    covers: light propagation, optical materials, imaging, lasers and photonic devices
  - slug: condensed-matter
    label: Mesoscale and nanoscale physics
    covers: electronic transport, low-dimensional materials, mesoscopic devices
  - slug: cosmology
    label: Cosmology
    covers: the early universe, cosmic expansion, dark matter and large-scale structure
  - slug: other-physics
    label: Other physics
    covers: interdisciplinary physics contributions outside the named categories
