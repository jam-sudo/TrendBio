domain: chemistry
label: Chemistry in research journals
window_by_publication: true
review_cluster_cohesion: true
fallback_category: other-chemistry
relevance: >
  Include chemical contributions to polymer materials, environmental transformations and
  sustainable chemistry. Route device engineering, ecosystem and policy outcomes by their primary contribution.
  Include studies reporting new chemical measurements, experimental or computational results, or
  validation of an analytical method. Classify each study by its central question. Set relevant
  to false for reviews and perspectives that describe previously published work, as well as
  protocols, announcements, editorials, corrections and retractions.
synthesis_guidance: >
  Name the substance, system or measurement that the papers can compare. Distinguish experimental
  observations from simulations and proposed mechanisms. Attribute performance claims, comparison
  conditions and uncertainty to the individual study that reports them.
