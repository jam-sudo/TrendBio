name: Deploy

on:
  push:
    branches: [main]
  # Data commits are pushed with GITHUB_TOKEN, which never triggers `push` workflows,
  # so redeploy when a pipeline workflow finishes instead.
  workflow_run:
    workflows: [Daily pipeline, Backfill, Resynthesize, Maintenance]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_PAGES != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r site/scripts/translation-requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trendbio/opus-en-ko-20220728
          key: linux-opus-en-ko-20220728-v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trendbio/ko-delta.json.gz
          key: ko-translations-v1-${{ github.sha }}
          restore-keys: ko-translations-v1-
      - name: Choose data roots
        run: |
          if compgen -G 'data/*/days/*.json' > /dev/null; then
            mkdir -p notes
            touch notes/.gitkeep
            echo "TRENDBIO_DATA_ROOT=../data" >> "$GITHUB_ENV"
            echo "TRENDBIO_NOTES_ROOT=../notes" >> "$GITHUB_ENV"
          else
            echo "::notice::No published days found; building with fixtures."
            echo "TRENDBIO_DATA_ROOT=../fixtures/data" >> "$GITHUB_ENV"
            echo "TRENDBIO_NOTES_ROOT=../fixtures/notes" >> "$GITHUB_ENV"
          fi
      - run: npm run build
        working-directory: site
      - name: Skip deployment without credentials
        if: env.HAS_DEPLOY_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN is empty; build succeeded, skipping Cloudflare Pages deployment."
      - name: Deploy to Cloudflare Pages
        if: env.HAS_DEPLOY_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=trendbio --branch=main --commit-dirty=true
