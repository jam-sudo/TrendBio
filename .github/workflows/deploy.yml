name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Choose data roots
        run: |
          if [ -d data/computational/days ] && [ -n "$(ls -A data/computational/days)" ]; then
            mkdir -p notes
            touch notes/.gitkeep
            echo "TRENDBIO_DATA_ROOT=../data" >> "$GITHUB_ENV"
            echo "TRENDBIO_NOTES_ROOT=../notes" >> "$GITHUB_ENV"
          else
            echo "::notice::No published days found; building with fixtures."
            echo "TRENDBIO_DATA_ROOT=../fixtures/data" >> "$GITHUB_ENV"
            echo "TRENDBIO_NOTES_ROOT=../fixtures/notes" >> "$GITHUB_ENV"
          fi
      - run: npm run build
        working-directory: site
      - name: Skip deployment without credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN is empty; build succeeded, skipping Cloudflare Pages deployment."
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=trendbio --branch=main --commit-dirty=true
