name: Published screen reader journey
on: workflow_dispatch
permissions:
  contents: read
jobs:
  read:
    name: ${{ matrix.reader }} with Chromium
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            reader: NVDA
          - os: macos-15
            reader: VoiceOver
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops/screen-readers
    steps:
      - name: Fetch the reader suite at this revision
        working-directory: .
        shell: bash
        run: |
          mkdir -p ops/screen-readers
          for file in package.json package-lock.json playwright.config.ts research.spec.ts; do
            curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/ops/screen-readers/${file}" -o "ops/screen-readers/${file}"
          done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx --yes @guidepup/setup@0.29.2 setup --ci
      - run: npx --yes @guidepup/setup@0.29.2 install
      - run: npx playwright install chromium
      - run: npx playwright test --reporter=line
