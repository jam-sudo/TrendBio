name: Maintenance

on:
  workflow_dispatch:
    inputs:
      command:
        description: Maintenance command
        type: choice
        required: true
        default: reprocess
        options:
          - map
          - restatus
          - reprocess
      reenrich:
        description: Re-enrich all stored items (reprocess only)
        type: boolean
        default: true
      only_missing_synthesis:
        description: Preserve existing topic syntheses (reprocess only)
        type: boolean
        default: false
      from:
        description: First date (YYYY-MM-DD, except map)
        type: string
        required: false
      to:
        description: Last date (YYYY-MM-DD, except map)
        type: string
        required: false
      model:
        description: Batch enrichment model (reprocess only)
        type: string
        default: claude-haiku-5-5

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      COMMAND: ${{ inputs.command }}
      REENRICH: ${{ inputs.reenrich }}
      ONLY_MISSING_SYNTHESIS: ${{ inputs.only_missing_synthesis }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
      - name: Maintain pipeline
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=(--domain computational)
          if [[ "$COMMAND" != "map" ]]; then args+=(--from "$FROM" --to "$TO"); fi
          case "$COMMAND" in
            reprocess)
              args+=(--model "$MODEL")
              if [[ "$REENRICH" == "true" ]]; then args+=(--reenrich); else args+=(--no-reenrich); fi
              if [[ "$ONLY_MISSING_SYNTHESIS" == "true" ]]; then args+=(--only-missing-synthesis); fi
              ;;
            restatus|map) ;;
            *) exit 1 ;;
          esac
          python -m pipeline "$COMMAND" "${args[@]}"
      - name: Commit data
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: $COMMAND $FROM..$TO"
            git pull --rebase --autostash origin main
            git push
          fi
