name: Backfill

on:
  workflow_dispatch:
    inputs:
      from:
        description: First date (YYYY-MM-DD)
        type: string
        required: true
      to:
        description: Last date (YYYY-MM-DD)
        type: string
        required: true
      resume:
        description: Continue from the saved checkpoint
        type: boolean
        default: true
      chain_until:
        description: Earliest month start to backfill (YYYY-MM-01)
        type: string
        required: false
        default: ""

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      FROM_DATE: ${{ inputs.from }}
      TO_DATE: ${{ inputs.to }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
      - name: Backfill pipeline
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESUME: ${{ inputs.resume }}
        run: |
          args=(backfill --domain computational --from "$FROM_DATE" --to "$TO_DATE")
          if [[ "$RESUME" == "true" ]]; then
            args+=(--resume)
          fi
          python -m pipeline "${args[@]}"
      - name: Commit data
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: backfill $FROM_DATE..$TO_DATE"
            git push
          fi
      - name: Chain previous month
        if: ${{ success() && inputs.chain_until != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ inputs.from }}
          CHAIN_UNTIL: ${{ inputs.chain_until }}
        run: |
          read -r PREV_FROM PREV_TO < <(python3 - "$FROM" <<'EOF'
          import sys, calendar
          from datetime import date
          d = date.fromisoformat(sys.argv[1])
          y, m = (d.year, d.month - 1) if d.month > 1 else (d.year - 1, 12)
          print(date(y, m, 1), date(y, m, calendar.monthrange(y, m)[1]))
          EOF
          )
          if [[ "$PREV_FROM" < "$CHAIN_UNTIL" ]]; then echo "::notice::chain finished at $FROM"; exit 0; fi
          gh workflow run backfill.yml -f from="$PREV_FROM" -f to="$PREV_TO" -f resume=false -f chain_until="$CHAIN_UNTIL"
