name: Field placement check
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROTOCOL: docs/expansion-measurements/2026-11-20/computer-science-boundaries.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Compare the model's decisions with the recorded expectations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ops/check-placements.py "$PROTOCOL" "$RUNNER_TEMP/placement-results.json"
          jq -r '.cases | group_by(.group)[] | "\(.[0].group) · \(map(select(.matches)) | length) of \(length) matched"' "$RUNNER_TEMP/placement-results.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: placement-results
          path: ${{ runner.temp }}/placement-results.json
          retention-days: 30
          if-no-files-found: error
