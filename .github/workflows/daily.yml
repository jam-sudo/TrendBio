name: Daily pipeline

on:
  schedule:
    - cron: "23 5 * * *"   # primary, 05:23 UTC
    - cron: "41 8 * * *"   # fallback 1
    - cron: "17 12 * * *"  # fallback 2
  workflow_dispatch:
    inputs:
      domain:
        description: Research field
        type: choice
        options: [all, computational, physics, biology]
        default: all
      date:
        description: UTC edition date (YYYY-MM-DD, defaults to the workflow creation date)
        type: string
        required: false
      dry_run:
        description: Print usage and cost without committing data
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  pipeline:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        domain: ${{ fromJSON((inputs.domain == 'all' || !inputs.domain) && '["computational","physics","biology"]' || format('["{0}"]', inputs.domain)) }}
    env:
      DOMAIN: ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/wait-for-pipeline
      - name: Refresh data after waiting
        run: git pull --ff-only origin main
      - name: Resolve the UTC edition date
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          day="$REQUESTED_DATE"
          if [[ -z "$day" ]]; then
            day="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[0:10]')"
          fi
          canonical="$(python3 -c 'from datetime import date; import sys; print(date.fromisoformat(sys.argv[1]))' "$day")"
          if [[ "$canonical" != "$day" ]]; then
            echo 'Edition date must use YYYY-MM-DD.' >&2
            exit 1
          fi
          echo "EDITION_DATE=$day" >> "$GITHUB_ENV"
      - name: Skip a scheduled field with complete paper sources
        id: ran-today
        if: ${{ github.event_name == 'schedule' }}
        run: |
          file="data/$DOMAIN/days/$EDITION_DATE.json"
          if [[ -f "$file" ]] && jq -e '[.run.source_status | .arxiv, .biorxiv, .pubmed] | any(. == "ok") and all(. == "ok" or . == "skipped")' "$file" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
      - name: Run pipeline
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLUESKY_HANDLE: ${{ matrix.domain == 'computational' && secrets.BLUESKY_HANDLE || '' }}
          BLUESKY_APP_PASSWORD: ${{ matrix.domain == 'computational' && secrets.BLUESKY_APP_PASSWORD || '' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run --domain "$DOMAIN" --date "$EDITION_DATE")
          echo "trendbio_daily_start field=$DOMAIN date=$EDITION_DATE dry=${DRY_RUN:-false}"
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m pipeline "${args[@]}"
      - name: Record edition coverage and evidence samples
        id: audit
        if: ${{ steps.ran-today.outputs.skip != 'true' && !inputs.dry_run && matrix.domain != 'computational' }}
        run: |
          python -m pipeline audit-edition --domain "$DOMAIN" --from "$EDITION_DATE" --to "$EDITION_DATE" > "$RUNNER_TEMP/coverage.json"
          mkdir -p "data/$DOMAIN/audits"
          mv "$RUNNER_TEMP/coverage.json" "data/$DOMAIN/audits/$EDITION_DATE.json"
          beta="data/$DOMAIN/audits/first-14.json"
          if [[ ! -f "$beta" ]] || ! jq -e '.live_editions >= .target_editions' "$beta" >/dev/null; then
            python -m pipeline audit-beta --domain "$DOMAIN" --to "$EDITION_DATE" > "$RUNNER_TEMP/beta.json"
            mv "$RUNNER_TEMP/beta.json" "$beta"
          fi
      - name: Commit data
        if: ${{ (success() || steps.audit.outcome == 'failure') && steps.ran-today.outputs.skip != 'true' && !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: $DOMAIN $EDITION_DATE run"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort
              echo '::warning::Data rebase conflicted; retrying once with an ours merge.'
              # Last resort after waiting: the fresher run wins conflicts in data/.
              git fetch origin main
              git merge --no-edit -X ours origin/main
            fi
            git push
          fi
