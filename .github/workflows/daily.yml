name: Daily pipeline

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: UTC date to process (YYYY-MM-DD; defaults to today)
        type: string
        required: false
      dry_run:
        description: Print usage and cost without committing data
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
      - name: Run pipeline
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run --domain computational)
          if [[ -n "$RUN_DATE" ]]; then
            args+=(--date "$RUN_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m pipeline "${args[@]}"
      - name: Commit data
        if: ${{ !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: $(date -u +%F) run"
            git push
          fi
