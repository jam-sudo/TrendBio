name: Daily pipeline

on:
  schedule:
    - cron: "23 5 * * *"   # primary, 05:23 UTC
    - cron: "41 8 * * *"   # fallback 1
    - cron: "17 12 * * *"  # fallback 2
  workflow_dispatch:
    inputs:
      date:
        description: UTC date to process (YYYY-MM-DD; defaults to today)
        type: string
        required: false
      dry_run:
        description: Print usage and cost without committing data
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip if today's run already succeeded
        id: ran-today
        if: ${{ github.event_name == 'schedule' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          today=$(date -u +%F)
          previous_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow daily.yml --status success --json databaseId,createdAt --limit 20 |
            jq -r --arg today "$today" '[.[] | select(.createdAt | startswith($today))][0] // empty | "\(.databaseId) \(.createdAt)"')
          if [[ -n "$previous_run" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "already ran today: $previous_run"
          fi
      - uses: ./.github/actions/wait-for-pipeline
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
      - name: Refresh data after waiting
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
      - name: Run pipeline
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run --domain computational)
          if [[ -n "$RUN_DATE" ]]; then
            args+=(--date "$RUN_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m pipeline "${args[@]}"
      - name: Commit data
        if: ${{ steps.ran-today.outputs.skip != 'true' && !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: $(date -u +%F) run"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort
              echo '::warning::Data rebase conflicted; retrying once with an ours merge.'
              # Last resort after waiting: the fresher run wins conflicts in data/.
              git fetch origin main
              git merge --no-edit -X ours origin/main
            fi
            git push
          fi
