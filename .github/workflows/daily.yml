name: Daily pipeline

on:
  schedule:
    - cron: "23 5 * * *"   # primary, 05:23 UTC
    - cron: "41 8 * * *"   # fallback 1
    - cron: "17 12 * * *"  # fallback 2
  workflow_dispatch:
    inputs:
      domain:
        description: Research field
        type: choice
        options: [all, computational, physics, biology, math]
        default: all
      date:
        description: UTC date to process (YYYY-MM-DD; defaults to today)
        type: string
        required: false
      dry_run:
        description: Print usage and cost without committing data
        type: boolean
        default: false

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  pipeline:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        domain: ${{ fromJSON((inputs.domain == 'all' || !inputs.domain) && '["computational","physics","biology"]' || format('["{0}"]', inputs.domain)) }}
    env:
      DOMAIN: ${{ matrix.domain }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/wait-for-pipeline
      - name: Refresh data after waiting
        run: git pull --ff-only origin main
      - name: Skip a scheduled field with complete paper sources
        id: ran-today
        if: ${{ github.event_name == 'schedule' }}
        run: |
          file="data/$DOMAIN/days/$(date -u +%F).json"
          if [[ -f "$file" ]] && jq -e '[.run.source_status | .arxiv, .biorxiv, .pubmed] | any(. == "ok") and all(. == "ok" or . == "skipped")' "$file" >/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
      - name: Run pipeline
        if: ${{ steps.ran-today.outputs.skip != 'true' }}
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLUESKY_HANDLE: ${{ matrix.domain == 'computational' && secrets.BLUESKY_HANDLE || '' }}
          BLUESKY_APP_PASSWORD: ${{ matrix.domain == 'computational' && secrets.BLUESKY_APP_PASSWORD || '' }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run --domain "$DOMAIN")
          if [[ -n "$RUN_DATE" ]]; then
            args+=(--date "$RUN_DATE")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          python -m pipeline "${args[@]}"
      - name: Retain the staged pilot for evidence review
        if: ${{ inputs.dry_run && matrix.domain == 'math' }}
        uses: actions/upload-artifact@v4
        with:
          name: math-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pipeline-stage-*/math/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Commit data
        if: ${{ steps.ran-today.outputs.skip != 'true' && !inputs.dry_run }}
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: $DOMAIN $(date -u +%F) run"
            if ! git pull --rebase --autostash origin main; then
              git rebase --abort
              echo '::warning::Data rebase conflicted; retrying once with an ours merge.'
              # Last resort after waiting: the fresher run wins conflicts in data/.
              git fetch origin main
              git merge --no-edit -X ours origin/main
            fi
            git push
          fi
