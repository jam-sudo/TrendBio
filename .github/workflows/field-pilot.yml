name: Field pilot
run-name: ${{ inputs.domain }} · ${{ inputs.date }} · ${{ inputs.action }}

on:
  workflow_dispatch:
    inputs:
      domain:
        type: choice
        options: [math, earth-environment, chemistry, astronomy, physics-expanded, computer-information, engineering, agriculture-food-veterinary, medicine-health, social-sciences, humanities-arts]
        required: true
      date:
        description: Edition UTC date (YYYY-MM-DD)
        type: string
        required: true
      action:
        type: choice
        options: [rank, rank-28d, rank-announced, audit, repair-summaries, rerank, replay]
        default: rank
      prior_run:
        description: Prior pilot ID. Rank advances one day and rank-28d advances 28 days. Review actions use the requested day.
        type: string
      repair_model:
        description: Model for repair-summaries
        type: choice
        default: claude-haiku-5-5
        options: [claude-haiku-5-5, claude-sonnet-5-5]

permissions:
  contents: read
  actions: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: ${{ inputs.domain == 'social-sciences' && (startsWith(inputs.action, 'rank') || inputs.action == 'rerank') && format('pilot-decisions-{0}-{1}', github.ref, inputs.domain) || format('pilot-{0}', github.run_id) }}
      queue: max
    env:
      DOMAIN: ${{ inputs.domain }}
      RUN_DATE: ${{ inputs.date }}
      PILOT_ACTION: ${{ inputs.action }}
      PRIOR_RUN: ${{ inputs.prior_run }}
      REPAIR_MODEL: ${{ inputs.repair_model || 'claude-haiku-5-5' }}
      SHARE_DECISIONS: ${{ github.ref == 'refs/heads/main' && inputs.domain == 'social-sciences' && (startsWith(inputs.action, 'rank') || inputs.action == 'rerank') }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate pilot inputs
        run: |
          case "$DOMAIN" in math|earth-environment|chemistry|astronomy|physics-expanded|computer-information|engineering|agriculture-food-veterinary|medicine-health|social-sciences|humanities-arts) ;; *) exit 1 ;; esac
          [[ "$RUN_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$(date -u -d "$RUN_DATE" +%F)" == "$RUN_DATE" && "$RUN_DATE" < "$(date -u -d tomorrow +%F)" ]]
          if [[ "$PILOT_ACTION" == rank-announced ]]; then [[ "$DOMAIN" == physics-expanded ]]; fi
          if [[ -n "$PRIOR_RUN" || "$PILOT_ACTION" != rank* ]]; then [[ "$PRIOR_RUN" =~ ^[0-9]+$ ]]; fi
          case "$REPAIR_MODEL" in claude-haiku-5-5|claude-sonnet-5-5) ;; *) exit 1 ;; esac
      - name: Restore the reviewed date
        if: ${{ inputs.prior_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prior="repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR_RUN"
          conclusion="$(gh api "$prior" | jq -er 'select(
            (.path == ".github/workflows/daily.yml" or .path == ".github/workflows/field-pilot.yml")
            and .head_branch == "main" and .event == "workflow_dispatch") | .conclusion')"
          if [[ "$conclusion" != success ]]; then
            # A preview failure can be retried using the already audited data.
            [[ "$conclusion" == failure ]]
            gh api "$prior/jobs?filter=latest" | jq -e 'any(.jobs[].steps[]; .name == "Save audited pilot data" and .conclusion == "success")' >/dev/null
          fi
          gh run download "$PRIOR_RUN" --pattern "$DOMAIN-pilot-$PRIOR_RUN-*" --dir "$RUNNER_TEMP/prior-pilot"
          restore_date="$RUN_DATE"
          if [[ "$PILOT_ACTION" == rank || "$PILOT_ACTION" == rank-announced ]]; then restore_date="$(date -u -d "$RUN_DATE -1 day" +%F)"; fi
          if [[ "$PILOT_ACTION" == rank-28d ]]; then restore_date="$(date -u -d "$RUN_DATE -28 days" +%F)"; fi
          mapfile -t days < <(find "$RUNNER_TEMP/prior-pilot" -type f -path "*/$DOMAIN/days/$restore_date.json")
          [[ ${#days[@]} == 1 ]]
          if [[ "$PILOT_ACTION" != audit ]]; then
            latest="$(find "$(dirname "${days[0]}")" -maxdepth 1 -name '*.json' -printf '%f\n' | sort | tail -1)"
            [[ "$latest" == "$restore_date.json" ]]
          fi
          mkdir science-pilot
          cp -R "$(dirname "$(dirname "${days[0]}")")" "science-pilot/$DOMAIN"
      - name: Restore the field's editorial decisions
        if: env.SHARE_DECISIONS == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$DOMAIN-editorial-decisions"
          pages=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100")
          runs=$(jq -r --argjson repo "$GITHUB_REPOSITORY_ID" '[.[] | .artifacts[] |
            select(.expired == false and .workflow_run.head_branch == "main" and .workflow_run.head_repository_id == $repo)]
            | sort_by(.created_at, .id) | reverse[] | .workflow_run.id' <<< "$pages")
          target="science-pilot/$DOMAIN/decisions"
          mkdir -p "$target"
          restored=()
          for run in $runs; do
            origin=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run")
            if jq -e '.event == "workflow_dispatch" and .path == ".github/workflows/field-pilot.yml"' <<< "$origin" >/dev/null; then
              snapshot="$RUNNER_TEMP/field-decisions-$run"
              gh run download "$run" -n "$name" -D "$snapshot"
              # Earlier validated receipts take precedence when old snapshots have diverged.
              cp -R "$snapshot/." "$target/"
              restored+=("$run")
              echo "Editorial decisions restored from run $run" | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ -f "$snapshot/lineage.json" ]] && jq -e --arg run "$run" '.version == 1 and .run == $run' "$snapshot/lineage.json" >/dev/null; then break; fi
            fi
          done
          jq -n --arg run "$GITHUB_RUN_ID" '{version: 1, run: $run, restored_newest_first: $ARGS.positional}' --args "${restored[@]}" > "$target/lineage.json"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        if: ${{ startsWith(inputs.action, 'rank') || inputs.action == 'rerank' || inputs.action == 'replay' }}
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
      - name: Process the pilot
        if: ${{ inputs.action != 'audit' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [[ "$PILOT_ACTION" == repair-summaries ]]; then
            python -m pipeline repair-synthesis --domain "$DOMAIN" --data-root science-pilot --from "$RUN_DATE" --to "$RUN_DATE" --retry-fallbacks --model "$REPAIR_MODEL"
          elif [[ "$PILOT_ACTION" == rank-28d ]]; then
            python -m pipeline run --domain "$DOMAIN" --data-root science-pilot --date "$RUN_DATE" --window-days 28
          elif [[ "$PILOT_ACTION" == rank-announced ]]; then
            python -m pipeline run --domain "$DOMAIN" --data-root science-pilot --date "$RUN_DATE" --arxiv-announcements
          elif [[ "$PILOT_ACTION" == replay ]]; then
            python -m pipeline run --domain "$DOMAIN" --data-root science-pilot --date "$RUN_DATE" --replay
          else
            python -m pipeline run --domain "$DOMAIN" --data-root science-pilot --date "$RUN_DATE"
          fi
      - name: Audit the result
        run: |
          mkdir -p "science-pilot/$DOMAIN/audits"
          extra=()
          if [[ "$(jq '.run.window_days // 7' "science-pilot/$DOMAIN/days/$RUN_DATE.json")" == 28 ]]; then extra+=(--compare-windows); fi
          python -m pipeline audit-edition --domain "$DOMAIN" --data-root science-pilot --from "$RUN_DATE" --to "$RUN_DATE" "${extra[@]}" > "science-pilot/$DOMAIN/audits/$RUN_DATE.json"
      - name: Save audited pilot data
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.domain }}-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: science-pilot/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build and verify the English reading copy
        working-directory: site
        env:
          TRENDBIO_DATA_ROOT: ../science-pilot
          TRENDBIO_NOTES_ROOT: ../notes
        run: |
          npm ci
          npx --no-install astro build
          node scripts/pilot-preview.mjs dist "../science-pilot/$DOMAIN/days/$RUN_DATE.json" "$RUNNER_TEMP/reading-copy"
      - name: Save the English reading copy
        id: preview
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.domain }}-english-${{ inputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reading-copy/
          if-no-files-found: error
          retention-days: 14
      - name: Link the preview
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.artifact-url }}
        run: |
          echo "[English edition]($PREVIEW_URL) · $DOMAIN · $RUN_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the ZIP and open en.html.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the field's editorial decisions
        if: env.SHARE_DECISIONS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.domain }}-editorial-decisions
          path: science-pilot/${{ inputs.domain }}/decisions/
          retention-days: 90
          overwrite: true
          if-no-files-found: ignore
