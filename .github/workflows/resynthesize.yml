name: Resynthesize

on:
  workflow_dispatch:
    inputs:
      from:
        description: First date (YYYY-MM-DD)
        type: string
        required: true
      to:
        description: Last date (YYYY-MM-DD)
        type: string
        required: true
      model:
        description: Synthesis model
        type: choice
        required: true
        default: claude-haiku-5-5
        options:
          - claude-haiku-5-5
          - claude-opus-5-5

concurrency:
  group: pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      MODEL: ${{ inputs.model }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-specter2
      - run: pip install -e .
      - name: Resynthesize pipeline
        env:
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pipeline resynthesize --domain computational --from "$FROM" --to "$TO" --model "$MODEL"
      - name: Commit data
        run: |
          if [[ -n "$(git status --porcelain data)" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data
            git commit -m "data: resynthesize $FROM..$TO ($MODEL)"
            git push
          fi
